# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pynq-z1"
BBFILE_PATTERN_meta-pynq-z1 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pynq-z1 = "6"

LAYERDEPENDS_meta-pynq-z1 = "core"
LAYERSERIES_COMPAT_meta-pynq-z1 = "scarthgap"

# Record this layer's location so the machine conf can find the SDT bundled
# under sdt/ without hard-coding an absolute path. ":=" expands immediately,
# while LAYERDIR is still set to this layer.
PYNQ_Z1_LAYERDIR := "${LAYERDIR}"
