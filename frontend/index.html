<!DOCTYPE html>
<html>
<head>
  <title>sysmon dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>sysmon</h1>

    <section class="grid">
      <div class="card">
        <h2>CPU</h2>
        <p id="cpu">--</p>
      </div>

      <div class="card">
        <h2>Memory</h2>
        <p id="mem">--</p>
      </div>

      <div class="card">
        <h2>Uptime</h2>
        <p id="uptime">--</p>
      </div>

      <div class="card">
        <h2>Load Avg</h2>
        <p id="loadavg">--</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
